const enc = new TextEncoder();
const dec = new TextDecoder();
function b64bytes(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
function concat(...arrays) { const n = arrays.reduce((a,b)=>a+b.length,0); const out = new Uint8Array(n); let o=0; for (const a of arrays) { out.set(a,o); o+=a.length; } return out; }

async function hmacKey(raw) { return crypto.subtle.importKey('raw', raw, {name:'HMAC', hash:'SHA-256'}, false, ['sign']); }
async function derive(token, salt, iterations) {
