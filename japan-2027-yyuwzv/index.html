const enc = new TextEncoder();
const dec = new TextDecoder();
function b64bytes(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
function concat(...arrays) { const n = arrays.reduce((a,b)=>a+b.length,0); const out = new Uint8Array(n); let o=0; for (const a of arrays) { out.set(a,o); o+=a.length; } return out; }
function u32(n) { return new Uint8Array([(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255]); }
async function hmacKey(raw) { return crypto.subtle.importKey('raw', raw, {name:'HMAC', hash:'SHA-256'}, false, ['sign']); }
async function derive(token, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', enc.encode(token), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations, hash:'SHA-256'}, base, 512);
  const key = new Uint8Array(bits);
  return [key.slice(0,32), key.slice(32)];
}
async function stream(key, nonce, len) {
  const hk = await hmacKey(key); const out = new Uint8Array(len); let pos = 0, ctr = 0;
  while (pos < len) { const block = new Uint8Array(await crypto.subtle.sign('HMAC', hk, concat(nonce, u32(ctr++)))); out.set(block.slice(0, Math.min(block.length, len-pos)), pos); pos += block.length; }

}
async function unlock(token) {
  const p = window.__ENCRYPTED_ITINERARY__, salt=b64bytes(p.salt), nonce=b64bytes(p.nonce), data=b64bytes(p.data), mac=b64bytes(p.mac);
  const [ek, mk] = await derive(token, salt, p.iterations);
  const hk = await hmacKey(mk);
  const actual = new Uint8Array(await crypto.subtle.sign('HMAC', hk, concat(salt, nonce, u32(p.iterations), data)));

function tokenFromHash() { const h = new URLSearchParams(location.hash.replace(/^#/,'')); return h.get('token') || ''; }
const saved = localStorage.getItem('itinerary-token') || tokenFromHash();
if (saved) { document.getElementById('token').value = saved; unlock(saved).catch(()=>localStorage.removeItem('itinerary-token')); }
document.getElementById('unlock').addEventListener('submit', ev => {
  ev.preventDefault(); const token = document.getElementById('token').value.trim();
  unlock(token).then(()=>localStorage.setItem('itinerary-token', token)).catch(()=>document.getElementById('err').textContent='That token did not work.');
});
